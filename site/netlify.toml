# AIOmni — Netlify configuration
# Static site, no build step. CSS + JSON are inlined into each HTML page.

[build]
  base = "."
  publish = "."
  command = "echo 'No build — static HTML.'"
  ignore = "/bin/true"

# ─── Pretty URLs ────────────────────────────────────────────────
# Allow visiting /how-it-works instead of /how-it-works.html
[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works.html"
  status = 200

[[redirects]]
  from = "/features"
  to = "/features.html"
  status = 200

[[redirects]]
  from = "/rankings"
  to = "/rankings.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

# ─── 404 fallback ───────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ─── Cache headers ──────────────────────────────────────────────
# HTML: short cache so updates land fast
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets: long cache (CSS/JSON are content stable per deploy)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Security headers ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
