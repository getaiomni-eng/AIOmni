
[functions.claude-proxy]
enabled = true
verify_jwt = true
import_map = "./functions/claude-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/claude-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/claude-proxy/*.html" ]

[functions.validate-promo]
enabled = true
verify_jwt = true
import_map = "./functions/validate-promo/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/validate-promo/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/validate-promo/*.html" ]

# Auth URLs (2026-08-09) — without these the project ran on defaults:
# site_url http://127.0.0.1:3000 and an EMPTY redirect allow-list, so
# the app's redirectTo: 'aiomnifantasy://auth/reset' was rejected and
# every password-reset email dumped users on 127.0.0.1. The allow-list
# must contain the deep link for the reset flow to reach the app.
[auth]
site_url = "https://getaiomni.com"
additional_redirect_urls = [
  "aiomnifantasy://auth/reset",
  "https://getaiomni.com",
]

# Custom SMTP via Resend (2026-08-03) — the built-in Supabase mailer is
# rate-limited (~4/hr) and Gmail-filters its sender; confirmation emails
# effectively never arrived. Applied to the linked project with:
#   RESEND_API_KEY=re_xxx npx supabase config push
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@getaiomni.com"
sender_name = "AIOmni"
